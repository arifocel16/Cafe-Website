<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Butik Kafe - Kayıt Ol">
  <title>Butik Kafe · Kayıt Ol</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

  <style>
    html, body {
      height: 100%;
    }
    
    body {
      display: flex;
      align-items: center;
      padding-top: 40px;
      padding-bottom: 40px;
      background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), 
                  url('https://images.unsplash.com/photo-1511920170033-f8396924c348?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
    }

    .form-signin {
      max-width: 380px;
      padding: 30px;
      background: rgba(33, 37, 41, 0.75); 
      border-radius: 15px; 
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); 
      backdrop-filter: blur(5px); 
    }

    .form-signin .form-floating:focus-within {
      z-index: 2;
    }
    
    .form-signin input {
      border-radius: 0;
      margin-bottom: -1px;
    }
    .form-signin input.first-input {
      border-top-left-radius: 0.375rem;
      border-top-right-radius: 0.375rem;
    }
    .form-signin input.last-input {
      border-bottom-left-radius: 0.375rem;
      border-bottom-right-radius: 0.375rem;
      margin-bottom: 15px;
    }

    .form-floating label {
      color: #6c757d;
    }
  </style>
</head>

<body class="text-center text-white">

  <main class="form-signin w-100 m-auto">
    <form>

      <h1 class="h3 mb-4 fw-normal">Yeni Hesap Oluştur</h1>
      
      <div class="form-floating text-dark">
        <input type="text" class="form-control first-input" id="floatingName" placeholder="Ad">
        <label for="floatingName">Adınız</label>
      </div>

      <div class="form-floating text-dark">
        <input type="text" class="form-control" id="floatingSurname" placeholder="Soyad">
        <label for="floatingSurname">Soyadınız</label>
      </div>

      <div class="form-floating text-dark">
        <input type="email" class="form-control" id="floatingEmail" placeholder="name@example.com">
        <label for="floatingEmail">E-posta adresi</label>
      </div>
      
      <div class="form-floating text-dark">
        <input type="password" class="form-control" id="floatingPassword1" placeholder="Şifre">
        <label for="floatingPassword1">Şifre</label>
      </div>

      <div class="form-floating text-dark">
        <input type="password" class="form-control last-input" id="floatingPassword2" placeholder="Şifre Tekrar">
        <label for="floatingPassword2">Şifre (Tekrar)</label>
      </div>
      
     <a href="anasayfa.html" class="btn btn-primary w-100 py-2">Kayıt Ol</a>

      <p class="mt-4 mb-1 text-white-50"><small>Zaten hesabınız var mı? <a href="giris.html" class="text-white text-decoration-none border-bottom">Giriş Yap</a></small></p>
      <p class="mt-3 mb-0 text-white-50"><small>&copy; 2026 Butik Kafe</small></p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

</body>
</html>
