  <!DOCTYPE html>
  <html lang="tr" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Butik Kafe - Giriş Yap">
    <title>Butik Kafe · Giriş Yap</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

    <style>
      html, body {
        height: 100%;
      }
      
      body {
        display: flex;
        align-items: center;
        padding-top: 40px;
        padding-bottom: 40px;
        background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
        url('https://images.unsplash.com/photo-1509042239860-f550ce710b93?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
        background-size: cover;
      }

      .form-signin {
        max-width: 350px;
        padding: 30px;
        background: rgba(33, 37, 41, 0.75); /* Orijinal koyu tema rengi, arkası hafif şeffaf */
        border-radius: 15px; 
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); 
        backdrop-filter: blur(5px); 
      }

      .form-signin .form-floating:focus-within {
        z-index: 2;
      }
      
      .form-signin input[type="email"] {
        margin-bottom: -1px;
        border-bottom-right-radius: 0;
        border-bottom-left-radius: 0;
      }
      
      .form-signin input[type="password"] {
        margin-bottom: 10px;
        border-top-left-radius: 0;
        border-top-right-radius: 0;
      }

      .form-floating label {
        color: #6c757d;
      }
    </style>
  </head>

  <body class="text-center text-white">

        <h1 class="h3 mb-3 fw-normal">Lütfen Giriş Yapın</h1>
        
        <div class="form-floating text-dark">
          <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
          <label for="floatingInput">E-posta adresi</label>
        </div>
        
        <div class="form-floating text-dark">
          <input type="password" class="form-control" id="floatingPassword" placeholder="Şifre">
          <label for="floatingPassword">Şifre</label>
        </div>
        
        <div class="form-check text-start my-3">
          <input class="form-check-input" type="checkbox" value="remember-me" id="checkDefault">
          <label class="form-check-label text-white" for="checkDefault">Beni Hatırla</label>
        </div>
        
        <a href="anasayfa.html" class="btn btn-primary w-100 py-2">Giriş Yap</a>
        
        <p class="mt-4 mb-1 text-white-50"><small>Hesabınız yok mu? <a href="kayitol.html" class="text-white text-decoration-none border-bottom">Kayıt Ol</a></small></p>
        <p class="mt-3 mb-0 text-white-50"><small>&copy; 2026 Butik Kafe</small></p>
      </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

  </body>
  </html>
